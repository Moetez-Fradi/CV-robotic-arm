[project]
name = "ras-arm-sim"
version = "0.1.0"
description = "Simulation and design calculations for the RAS Build Challenge 6-axis robotic arm"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "mujoco>=3.2",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10",
    "opencv-python>=4.9",
]

[tool.uv]
package = false
